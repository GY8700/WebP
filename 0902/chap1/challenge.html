<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>나의 소개</title>
<style>
  body { 
    background-color : #e6e0f0; /* 배경색 (연보라색 계열) */
    margin-left : 40px; 
    margin-right : 40px;
  }
  h3 { 
    text-align : center; 
    color : darkred;
  }
  hr { 
    height : 5px; 
    border : solid grey; 
    background-color : grey; 
  }
  span { 
    color : blue; 
    font-size : 20px; 
  }
</style>
<script>
  function show() {
    // 마우스를 올렸을 때 사진 표시 (이미지 파일명: shrek.png)
    document.getElementById("fig").src = "shrek.png";
  }
  function hide() {
    // 마우스를 내렸을 때 사진 제거
    document.getElementById("fig").src = "";
  }
</script>
</head>
<body>
  <h3 onmouseover="show()" onmouseout="hide()">슈렉</h3>
  <hr>
  <div><img id="fig" src=""></div>
  <p>
    저는 대한민국에서 태어나서 컴퓨터 공학을 전공하는 학생입니다. 
    제가 제일 좋아하는 과목은 <span>웹 프로그래밍</span>이고, 
    그 중에서도 <span>자바스크립트</span>를 제일 잘합니다.
  </p>
</body>
</html>
